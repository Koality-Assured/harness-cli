name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute GoReleaser arguments
        id: release_args
        run: |
          SKIPS=""
          if [ -z "${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GH_PAT }}" ]; then
            SKIPS="homebrew"
          fi
          if [ -z "${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN || secrets.GH_PAT }}" ]; then
            if [ -n "$SKIPS" ]; then
              SKIPS="$SKIPS,scoop"
            else
              SKIPS="scoop"
            fi
          fi
          ARGS="release --clean"
          if [ -n "$SKIPS" ]; then
            ARGS="$ARGS --skip=$SKIPS"
          fi
          echo "Computed release arguments: $ARGS"
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.release_args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GH_PAT || '' }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN || secrets.GH_PAT || '' }}
